services:
  - type: web
    name: incident-intelligence
    runtime: docker
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: incident-intelligence-db
          property: connectionString
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
databases:
  - name: incident-intelligence-db
    plan: free
    databaseName: incident_intelligence
    user: incident_user
